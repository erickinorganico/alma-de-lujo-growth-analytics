name: Verify analytical release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-archive:
    name: Release archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      # The verifier extracts this exact commit, installs requirements-client.txt
      # in a disposable venv and runs identical gates on both operating systems.
      # CI validates committed Excel/visual receipts but never launches Excel.
      - name: Prove committed archive and publish machine-readable receipt
        run: >-
          python scripts/verify_release_archive.py prove
          --ref "${{ github.sha }}"
          --output build/ci-release-archive
          --archive-receipt build/ci-release-archive.json
          --local-only
      - name: Save archive verification receipt
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-receipt-${{ matrix.os }}
          path: build/ci-release-archive.json
          if-no-files-found: warn
